name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck && luarocks install busted
      - id: stylua
        run: echo "version=$(tr -d '[:space:]' < .stylua-version)" >> "$GITHUB_OUTPUT"
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.stylua.outputs.version }}
          args: --check Core Logic Data UI tests
      - run: make lint test LUA_BIN=
